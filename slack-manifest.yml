display_information:
  name: Paywall
  description: No numbers, no entry. Keeps the pin honest and freeloaders out.
  background_color: "#1a3a2a"
features:
  bot_user:
    display_name: Paywall
    always_online: true
  slash_commands:
    - command: /salary
      description: Spill your TC, check status, or (admin) list the naughty
      usage_hint: "[status | overdue]"
      should_escape: false
oauth_config:
  scopes:
    bot:
      - chat:write
      - commands
      - im:write
      - groups:read
      - groups:write
      - pins:read
      - pins:write
      - users:read
settings:
  event_subscriptions:
    bot_events:
      - member_joined_channel
      - member_left_channel
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
